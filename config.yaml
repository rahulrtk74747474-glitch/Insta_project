# Milestone 1: ingest, transcription, translation. No publishing.
output_dir: output
database: state/jobs.sqlite3
demucs:
  enabled: true
  model: htdemucs
whisper:
  provider: improved
  model: base.en
  device: cpu
  compute_type: int8
  beam_size: 4
  vad_filter: true
translation:
  provider: openai
  mode: spoken_adaptation
  audience: tum
  min_group_seconds: 6
  max_group_seconds: 14
  max_group_cues: 4
  model: gpt-4o-mini
  batch_size: 4
  max_quality_attempts: 3
  speed_tolerance: 1.15
  glossary:
    active recall: एक्टिव रिकॉल
    spaced repetition: स्पेस्ड रिपिटिशन
    Stephen Hawking: स्टीफन हॉकिंग
voice:
  provider: omnivoice
  model: k2-fsa/OmniVoice
  voice: personal_hindi_reference
  reference_voice_consent_confirmed: true
  reference_audio: input/private_voice/hindi_voice_reference_9s.wav
  reference_text_file: input/private_voice/hindi_voice_reference_9s.txt
  device: auto
  num_step: 32
  generation_speed: 1.0
  max_tempo: 1.18
  audio_sample_rate: 24000
  auto_shorten: true
  max_rewrites: 2
  rewrite_model: gpt-4o-mini
render:
  landscape: [1280, 720]
  portrait: [720, 1280]
  portrait_mode: fit
  fps: 30
  preset: veryfast
  crf: 23
  burn_subtitles: true
  subtitle_font: Noto Sans Devanagari
  subtitle_font_size: 24
  mix_separated_background: false
  background_volume: 0.12

# Milestone 1: ingest, transcription, translation. No publishing.
output_dir: output
database: state/jobs.sqlite3
demucs:
  enabled: true
  model: htdemucs
whisper:
  provider: improved
  model: base.en
  device: cpu
  compute_type: int8
  beam_size: 4
  vad_filter: true
translation:
  provider: openai
  mode: spoken_adaptation
  audience: tum
  min_group_seconds: 6
  max_group_seconds: 14
  max_group_cues: 4
  model: gpt-4o-mini
  batch_size: 4
  max_quality_attempts: 3
  speed_tolerance: 1.15
  glossary:
    active recall: एक्टिव रिकॉल
    spaced repetition: स्पेस्ड रिपिटिशन
    Stephen Hawking: स्टीफन हॉकिंग
voice:
  provider: openai
  model: gpt-4o-mini-tts
  voice: marin
  max_tempo: 1.18
  audio_sample_rate: 24000
  auto_shorten: true
  max_rewrites: 2
  rewrite_model: gpt-4o-mini

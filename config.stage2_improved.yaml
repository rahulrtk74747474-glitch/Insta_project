# Improved Stage 2 only. Stage 1 Demucs is intentionally skipped until weights are available.
output_dir: output_improved
database: state/jobs_improved.sqlite3
demucs:
  enabled: false
  model: htdemucs
whisper:
  provider: improved
  model: base.en
  device: cpu
  compute_type: int8
  beam_size: 4
  vad_filter: true
translation:
  provider: openai
  model: gpt-4o-mini
  batch_size: 10
  glossary: {}

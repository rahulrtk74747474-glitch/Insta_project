name: Milestone 1 - Ingest Transcribe Translate Tests
on:
  push:
    paths: ['hindi_pipeline/**', 'run.py', 'tests/test_pipeline.py', '.github/workflows/milestone1.yml']
  pull_request:
    paths: ['hindi_pipeline/**', 'run.py', 'tests/test_pipeline.py', '.github/workflows/milestone1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pipeline.py' -v

name: Stage 2 - English Word-Timestamp Transcription
on:
  push:
    branches: ['feature/stage2-english-transcription']
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_stage2.py'
      - 'scripts/stage2_live_smoke.py'
      - '.github/workflows/stage2.yml'
  pull_request:
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_stage2.py'
      - 'scripts/stage2_live_smoke.py'
      - '.github/workflows/stage2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage 2 and previous Stage 1 unit tests
        run: |
          python -m unittest discover -s tests -p test_stage2.py -v
          python -m unittest discover -s tests -p test_pipeline.py -v
  actual-whisper-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install English TTS and actual ASR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          pip install 'faster-whisper>=1.1,<2'
      - name: Transcribe synthesized English narration (tiny.en)
        run: python -m scripts.stage2_live_smoke

name: Hindi Reel Pipeline
on:
  push:
    branches: ["feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insta-reel-daily
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak fonts-noto-core
          pip install -r requirements.txt
      - name: Test code
        run: python -m unittest discover -s tests -v
      - name: Render Hindi sample
        run: python -m reelbot --storyboard data/storyboards/time_loop.json --output dist/preview.mp4
      - name: Inspect video
        run: |
          test -s dist/preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 dist/preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hindi-reel-preview
          path: |
            dist/preview.mp4
            dist/preview_scenes/*.mp4
          retention-days: 7



  skills-cli-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Vercel Labs skills CLI and discover our local skill
        run: |
          npx --yes skills --help
          npx --yes skills add ./.agents/skills/hindi-reel-production --list

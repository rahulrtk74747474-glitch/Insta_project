name: Hindi Reel Pipeline
on:
  push:
    branches: ["feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a rights-approved item (requires ENABLE_AUTOPUBLISH=true)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '35 18 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: insta-reel-daily
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak fonts-noto-core
          pip install -r requirements.txt
      - name: Test code
        run: python -m unittest discover -s tests -v
      - name: Render Hindi sample
        run: python -m reelbot --storyboard data/storyboards/time_loop.json --output dist/preview.mp4
      - name: Inspect video
        run: |
          test -s dist/preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 dist/preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hindi-reel-preview
          path: |
            dist/preview.mp4
            dist/preview_scenes/*.mp4
          retention-days: 7

  publish:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.ENABLE_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ENABLE_AUTOPUBLISH: 'true'
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak fonts-noto-core
          pip install -r requirements.txt
      - name: Render and post
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -m reelbot --queue data/queue.json --output dist/daily.mp4 --publish --wait-until-7pm
          else
            python -m reelbot --queue data/queue.json --output dist/daily.mp4 --publish
          fi
      - name: Save queue state, including after partial upload failure
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Record reel upload results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  skills-cli-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Vercel Labs skills CLI and discover our local skill
        run: |
          npx --yes skills --help
          npx --yes skills add ./.agents/skills/hindi-reel-production --list

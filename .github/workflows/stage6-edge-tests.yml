name: Stage 6 - Hindi Neural Provider Tests
on:
  push:
    branches: [feature/stage6-final-hindi-film]
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_voice_edge.py'
      - '.github/workflows/stage6-edge-tests.yml'
      - 'scripts/render_neural_hindi.py'
  pull_request:
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_voice_edge.py'
      - '.github/workflows/stage6-edge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Offline neural provider with real FFmpeg tests
        run: |
          python -m unittest discover -s tests -p 'test_voice_edge.py' -v
          python -m unittest discover -s tests -p 'test_stage4.py' -v
          python -m unittest discover -s tests -p 'test_stage5.py' -v

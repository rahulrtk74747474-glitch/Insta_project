name: Stage 4 - OmniVoice Personal Hindi Provider Tests
on:
  push:
    branches: ['feature/stage4-personal-omnivoice']
  pull_request:
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_voice_omnivoice.py'
      - '.github/workflows/voice-omnivoice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  omnivoice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for synthetic WAV tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test OmniVoice Python SDK adapter (mock model; no user voice)
        run: |
          python -m unittest discover -s tests -p 'test_voice_omnivoice.py' -v
          python -m unittest discover -s tests -p 'test_stage4.py' -v

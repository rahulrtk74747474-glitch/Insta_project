name: Stage 3 - Hindi Translation Validation
on:
  push:
    branches: ['feature/stage3-hindi-translation', 'feature/stage3-natural-spoken-hindi']
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_stage3.py'
      - 'tests/test_spoken_adapter.py'
      - 'config.yaml'
      - '.github/workflows/stage3.yml'
  pull_request:
    paths:
      - 'hindi_pipeline/**'
      - 'tests/test_stage3.py'
      - 'tests/test_spoken_adapter.py'
      - 'config.yaml'
      - '.github/workflows/stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage 1 + Stage 2 Option B + original Stage 3 + natural Hindi adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_stage2.py' -v
          python -m unittest discover -s tests -p 'test_stage2_improved.py' -v
          python -m unittest discover -s tests -p 'test_stage3.py' -v
          python -m unittest discover -s tests -p 'test_spoken_adapter.py' -v

name: Stage2 improved model download
on:
  push:
    branches: ['feature/stage2-improved-transcription']
    paths: ['.github/workflows/stage2-model-asset.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download licensed public base.en model weights
        run: |
          pip install 'huggingface_hub>=0.30,<1.5'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          output=Path('dist/base.en')
          snapshot_download('Systran/faster-whisper-base.en',local_dir=output,
                            allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*'])
          for p in output.glob('*'): print(p.name,p.stat().st_size)
          assert (output/'model.bin').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-base-en-model
          path: dist/base.en/
          retention-days: 1
